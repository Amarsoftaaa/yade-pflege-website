<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <!-- Emerald Gradient -->
    <radialGradient id="emeraldGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#0F684B"/>
      <stop offset="85%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7B38"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Botanical Wreath Arc (Top Left & Right) -->
    <!-- Left Branch -->
    <path d="M 125,75 Q 110,40 135,25 Q 165,15 200,20" fill="none" stroke="#244B39" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Leaf 1 -->
    <path d="M 130,55 Q 115,50 120,40 Q 132,45 130,55 Z" fill="#244B39" opacity="0.85"/>
    <!-- Leaf 2 -->
    <path d="M 145,35 Q 135,22 148,18 Q 155,28 145,35 Z" fill="#244B39" opacity="0.9"/>
    <!-- Leaf 3 -->
    <path d="M 170,22 Q 165,8 178,8 Q 182,20 170,22 Z" fill="#244B39" opacity="0.85"/>
    <!-- Leaf 4 -->
    <path d="M 195,19 Q 198,5 208,10 Q 205,22 195,19 Z" fill="#244B39" opacity="0.9"/>

    <!-- Right Branch -->
    <path d="M 275,20 Q 310,15 340,25 Q 365,40 350,75" fill="none" stroke="#244B39" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Right Leaves -->
    <path d="M 280,19 Q 277,5 288,8 Q 290,20 280,19 Z" fill="#244B39" opacity="0.9"/>
    <path d="M 305,22 Q 315,8 325,18 Q 318,28 305,22 Z" fill="#244B39" opacity="0.85"/>
    <path d="M 330,35 Q 345,22 352,32 Q 342,42 330,35 Z" fill="#244B39" opacity="0.9"/>
    <path d="M 345,55 Q 360,50 355,62 Q 342,60 345,55 Z" fill="#244B39" opacity="0.85"/>

    <!-- Outer Circular Thin Frame -->
    <circle cx="237" cy="62" r="54" fill="none" stroke="#244B39" stroke-width="1.2" opacity="0.75" stroke-dasharray="180 8"/>

    <!-- Emerald Gem / Sphere -->
    <ellipse cx="237" cy="46" rx="20" ry="14" fill="url(#emeraldGrad)" filter="url(#softGlow)"/>
    <!-- Reflection highlight on gem -->
    <ellipse cx="232" cy="41" rx="8" ry="4" fill="#FFFFFF" opacity="0.55" transform="rotate(-15 232 41)"/>

    <!-- Cupping Hand Contour Line -->
    <path d="M 205,62 Q 220,72 237,72 Q 254,72 269,62 Q 260,78 237,79 Q 214,78 205,62 Z" fill="none" stroke="#244B39" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 200,68 C 215,82 230,84 237,84 C 244,84 259,82 274,68" fill="none" stroke="#244B39" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Main Title: YADE -->
    <text x="237" y="132" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#244B39" letter-spacing="14" text-anchor="middle">YADE</text>

    <!-- Subtitle: AMBULANTE PFLEGE & BETREUUNG -->
    <text x="237" y="156" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="600" fill="#244B39" letter-spacing="4" text-anchor="middle">AMBULANTE PFLEGE &amp; BETREUUNG</text>

    <!-- Small Gold Heart Accent -->
    <path d="M 237,171 C 237,171 233,166 230,166 C 227.5,166 225.5,168 225.5,170.5 C 225.5,173.5 229,176.5 237,181 C 245,176.5 248.5,173.5 248.5,170.5 C 248.5,168 246.5,166 244,166 C 241,166 237,171 237,171 Z" fill="url(#goldGrad)"/>

    <!-- Tagline: Pflege mit Herz. Zuhause in guten Händen. -->
    <text x="237" y="202" font-family="'Playfair Display', 'Alex Brush', 'Dancing Script', Georgia, serif" font-style="italic" font-size="17" font-weight="500" fill="#0F684B" text-anchor="middle">Pflege mit Herz. Zuhause in guten Händen.</text>
  </g>
</svg>
